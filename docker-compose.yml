services:
  postgres:
    image: postgres:15
    container_name: nessie-postgres
    environment:
      POSTGRES_USER: nessie
      POSTGRES_PASSWORD: nessie
      POSTGRES_DB: nessie
    ports:
      - "5433:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - local-iceberg-lakehouse

  nessie:
    image: projectnessie/nessie:latest
    container_name: nessie
    ports:
      - "19120:19120"
    environment:
      NESSIE_VERSION_STORE_TYPE: JDBC
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://nessie-postgres:5432/nessie
      QUARKUS_DATASOURCE_USERNAME: nessie
      QUARKUS_DATASOURCE_PASSWORD: nessie
    depends_on:
      - postgres
    networks:
      - local-iceberg-lakehouse


  trino:
    image: trinodb/trino:latest
    container_name: trino
    ports:
      - "8080:8080"
    networks:
      - local-iceberg-lakehouse
    volumes:
      - ./trino/catalog:/etc/trino/catalog

  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      local-iceberg-lakehouse:
        aliases:
          - warehouse.minio
    volumes:
      - ./minio-data:/data
    command: server /data --console-address ":9001"

  minio-client:
    image: minio/mc:latest
    container_name: minio-client
    depends_on:
      - minio
    networks:
      - local-iceberg-lakehouse
    entrypoint: >
      sh -c "
      until (mc alias set minio http://minio:9000 admin password) do echo '...waiting...' && sleep 1; done;
      mc mb minio/warehouse || true;
      mc anonymous set public minio/warehouse;
      tail -f /dev/null
      "
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: testdb
      MYSQL_USER: trino
      MYSQL_PASSWORD: trino
    ports:
      - "3307:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
    networks:
      - local-iceberg-lakehouse
networks:
  local-iceberg-lakehouse:
    name: local-iceberg-lakehouse

volumes:
  postgres-data:
  minio-data:
